<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/style.css">
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
        <title>Repaso web</title>
        <!-- Bootstrap CSS and JS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <style>
            body {
                background-color: #f5f5f5;
                color: #333333;
                font-family: 'Frutiger', sans-serif;
            }
            h1 {
                text-align: center;
                margin-top: 20px;
                color: #0056b3;
            }
            .card {
                margin-bottom: 15px;
                border: 1px solid #cccccc;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .card img {
                max-width: 150px;
                max-height: 150px;
                border-radius: 5px;
                margin-right: 15px;
            }
            .card-body {
                display: flex;
                align-items: center;
            }
            .card-body div {
                flex: 1;
            }
        </style>
    </head>
<body onload="cargarDatos()">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Repaso Web</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tabla.html">Registros</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <h1>Registros</h1>
    <div class="accordion" id="accordionRegistros">
        <!-- Collapsible items will be appended here -->
    </div>
</body>
<script>
    function cargarDatos() {
        $.ajax({
            url: 'https://67f5cc33913986b16fa590c8.mockapi.io/Servicios',
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                console.log(data);
                for (var i = 0; i < data.length; i++) {
                    var item = `
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading${i}">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${i}" aria-expanded="false" aria-controls="collapse${i}">
                                    ${data[i].nombre}
                                </button>
                            </h2>
                            <div id="collapse${i}" class="accordion-collapse collapse" aria-labelledby="heading${i}" data-bs-parent="#accordionRegistros">
                                <div class="accordion-body">
                                    <div class="card">
                                        <div class="card-body">
                                            <img src="${data[i].imagen}" alt="Imagen">
                                            <div>
                                                <p><strong>Costo:</strong> ${data[i].costo}</p>
                                                <p><strong>Duración:</strong> ${data[i].duracion}</p>
                                                <p><strong>Tipo:</strong> ${data[i].tipo}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    $("#accordionRegistros").append(item);
                }
            },
            error: function(xhr, status, error) {
                alert("Error al cargar los datos: " + status + " " + error);
            }
        });
    }
</script>
</html>
